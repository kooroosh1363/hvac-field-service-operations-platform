services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: northstar
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: northstar
    volumes:
      - northstar_pg:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build: ./services/api
    env_file: .env
    environment:
      DATABASE_URL: postgres://northstar:northstar@postgres:5432/northstar
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["4000:4000"]
  web:
    build: .
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  northstar_pg:
